name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      adopt_existing_schema:
        description: 'Register the pre-existing initial schema once, then deploy pending migrations'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: lgsdoutarthfymbjgdrj
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Explain missing deployment credential
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo 'Deployment skipped: configure the SUPABASE_ACCESS_TOKEN repository secret.'

      - name: Adopt the pre-existing initial schema
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.adopt_existing_schema }}
        run: supabase migration repair --status applied 20261013 --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*; do
            supabase functions deploy "$(basename "$function_dir")" --project-ref "$SUPABASE_PROJECT_REF"
          done
